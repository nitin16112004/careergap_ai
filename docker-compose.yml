name: careerguid-ai

x-backend-environment: &backend-environment
  NODE_ENV: ${NODE_ENV:-production}
  PORT: 5000
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  AI_SERVICE_URL: http://ai-service:8000
  AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-90000}
  SUPABASE_URL: ${SUPABASE_URL:-https://example.supabase.co}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-local-placeholder}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-placeholder}
  REDIS_URL: redis://:${REDIS_PASSWORD:-local-dev-redis-password}@redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-2000}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}

x-service-defaults: &service-defaults
  restart: unless-stopped
  stop_grace_period: 15s
  networks:
    - careerguid-ai

services:
  edge:
    <<: *service-defaults
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${VITE_API_URL:-/api/v1}
        PUBLIC_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://example.supabase.co}
        PUBLIC_SUPABASE_ANON_VALUE: ${VITE_SUPABASE_ANON_KEY:-public-anon-key-placeholder}
    expose:
      - "8080"

  backend:
    <<: *service-defaults
    build:
      context: ./backend
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  resume-worker:
    <<: *service-defaults
    build:
      context: ./backend
    command: ["npm", "run", "worker:start"]
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  roadmap-worker:
    <<: *service-defaults
    build:
      context: ./backend
    command: ["npm", "run", "roadmap-worker:start"]
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  ai-service:
    <<: *service-defaults
    build:
      context: ./ai-service
    environment:
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1536}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-45}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-dev-redis-password}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-local-dev-redis-password}
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis-data:

networks:
  careerguid-ai:
    driver: bridge
