name: careerguid-ai

x-backend-environment: &backend-environment
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 5000
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  AI_SERVICE_URL: http://ai-service:8000
  SUPABASE_URL: ${SUPABASE_URL:-https://example.supabase.co}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-local-placeholder}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-local-placeholder}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  backend:
    build:
      context: ./backend
    container_name: careerguid-ai-backend
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - careerguid-ai

  resume-worker:
    build:
      context: ./backend
    container_name: careerguid-ai-resume-worker
    command: ["npm", "run", "worker:start"]
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - careerguid-ai

  roadmap-worker:
    build:
      context: ./backend
    container_name: careerguid-ai-roadmap-worker
    command: ["npm", "run", "roadmap-worker:start"]
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - careerguid-ai

  ai-service:
    build:
      context: ./ai-service
    container_name: careerguid-ai-service
    environment:
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1536}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-45}
    ports:
      - "8000:8000"
    networks:
      - careerguid-ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careerguid-ai-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - careerguid-ai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:

networks:
  careerguid-ai:
    driver: bridge
