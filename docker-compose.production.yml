name: careerguid-ai-production

x-backend-image: &backend-image "${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/careerguid-ai-backend:${IMAGE_TAG:?IMAGE_TAG is required}"
x-frontend-image: &frontend-image "${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/careerguid-ai-frontend:${IMAGE_TAG:?IMAGE_TAG is required}"
x-ai-image: &ai-image "${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/careerguid-ai-service:${IMAGE_TAG:?IMAGE_TAG is required}"

x-service-defaults: &service-defaults
  restart: unless-stopped
  stop_grace_period: 20s
  init: true
  security_opt:
    - no-new-privileges:true
  networks:
    - careerguid-ai-production
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: "5000"
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
  AI_SERVICE_URL: http://ai-service:8000
  AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-90000}
  SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-2000}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
  EMAIL_PROVIDER_BASE_URL: ${EMAIL_PROVIDER_BASE_URL:-https://api.resend.com}
  EMAIL_PROVIDER_API_KEY: ${EMAIL_PROVIDER_API_KEY:?EMAIL_PROVIDER_API_KEY is required}
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
  REMINDER_CRON_PATTERN: ${REMINDER_CRON_PATTERN:-0 0 9 * * 1}
  REMINDER_CRON_TIMEZONE: ${REMINDER_CRON_TIMEZONE:-UTC}
  REMINDER_INACTIVE_DAYS: ${REMINDER_INACTIVE_DAYS:-7}
  REMINDER_SCAN_BATCH_SIZE: ${REMINDER_SCAN_BATCH_SIZE:-500}
  REMINDER_EMAIL_JOB_ATTEMPTS: ${REMINDER_EMAIL_JOB_ATTEMPTS:-3}
  ACTIVITY_TOUCH_INTERVAL_SECONDS: ${ACTIVITY_TOUCH_INTERVAL_SECONDS:-300}
  BILLING_DEFAULT_PROVIDER: ${BILLING_DEFAULT_PROVIDER:-razorpay}
  BILLING_WEBHOOK_TOLERANCE_SECONDS: ${BILLING_WEBHOOK_TOLERANCE_SECONDS:-300}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRO_MONTHLY_PRICE_ID: ${STRIPE_PRO_MONTHLY_PRICE_ID:-}
  STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
  STRIPE_PREMIUM_MONTHLY_PRICE_ID: ${STRIPE_PREMIUM_MONTHLY_PRICE_ID:-}
  STRIPE_PREMIUM_YEARLY_PRICE_ID: ${STRIPE_PREMIUM_YEARLY_PRICE_ID:-}

services:
  edge:
    <<: *service-defaults
    image: nginx:1.27-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ${TLS_CERT_FILE:?TLS_CERT_FILE is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE:?TLS_KEY_FILE is required}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s

  frontend:
    <<: *service-defaults
    image: *frontend-image
    expose:
      - "8080"

  backend:
    <<: *service-defaults
    image: *backend-image
    environment: *backend-environment
    depends_on:
      ai-service:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  resume-worker:
    <<: *service-defaults
    image: *backend-image
    command: ["npm", "run", "worker:start"]
    environment: *backend-environment
    depends_on:
      ai-service:
        condition: service_healthy

  roadmap-worker:
    <<: *service-defaults
    image: *backend-image
    command: ["npm", "run", "roadmap-worker:start"]
    environment: *backend-environment
    depends_on:
      ai-service:
        condition: service_healthy

  email-worker:
    <<: *service-defaults
    image: *backend-image
    command: ["npm", "run", "email-worker:start"]
    environment: *backend-environment

  reminder-scheduler:
    <<: *service-defaults
    image: *backend-image
    command: ["npm", "run", "reminder-scheduler:start"]
    environment: *backend-environment

  ai-service:
    <<: *service-defaults
    image: *ai-image
    environment:
      AI_SERVICE_PORT: "8000"
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1536}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?EMBEDDING_BASE_URL is required}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?EMBEDDING_API_KEY is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL is required}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-45}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  careerguid-ai-production:
    driver: bridge
