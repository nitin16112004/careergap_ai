name: Product CI

on:
  pull_request:
    branches: [main, dev, feat/mvp-backbone, feat/ats-v1-1, feat/rag-v1-2, feat/v1-3-hardening, feat/v1-4-reminders, feat/billing-upgrade, feat/admin-panel, feat/phase16-testing, feat/phase17-deployment]
  push:
    branches: [main, dev, feat/mvp-backbone, feat/ats-v1-1, feat/rag-v1-2, feat/v1-3-hardening, feat/v1-4-reminders, feat/billing-upgrade, feat/admin-panel, feat/phase16-testing, feat/phase17-deployment]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit high-severity production dependencies
        # Audit the reproducible lockfile graph instead of the platform-specific
        # installed tree. This keeps the security gate blocking on high severity
        # findings while avoiding npm Quick Audit invalid-tree failures.
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit high-severity production dependencies
        # Audit the reproducible lockfile graph instead of the platform-specific
        # installed tree. This keeps the security gate blocking on high severity
        # findings while avoiding npm Quick Audit invalid-tree failures.
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Dependency consistency
        run: pip check
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        run: pytest -q

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate development Compose model
        run: docker compose config --quiet
      - name: Validate production Compose model
        run: docker compose --env-file deployment/production.env.example -f docker-compose.production.yml config --quiet
      - name: Validate production environment checker
        run: sh deployment/validate-production-env.sh deployment/production.env.example
      - name: Build backend image
        run: docker build -t careerguid-ai-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t careerguid-ai-frontend:ci ./frontend
      - name: Build AI service image
        run: docker build -t careerguid-ai-service:ci ./ai-service
      - name: Validate edge Nginx configuration
        run: >-
          docker run --rm
          --add-host backend:127.0.0.1
          --add-host frontend:127.0.0.1
          -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t
      - name: Validate production HTTPS Nginx configuration
        run: |
          mkdir -p /tmp/careerguid-ai-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=app.example.com" \
            -keyout /tmp/careerguid-ai-tls/privkey.pem \
            -out /tmp/careerguid-ai-tls/fullchain.pem >/dev/null 2>&1
          docker run --rm \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            -e APP_DOMAIN=app.example.com \
            -e NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx \
            -v "$PWD/infra/nginx/nginx.prod.conf.template:/etc/nginx/templates/nginx.conf.template:ro" \
            -v "/tmp/careerguid-ai-tls:/etc/nginx/tls:ro" \
            nginx:1.27-alpine nginx -t
      - name: Validate deployment scripts
        run: |
          sh -n deployment/validate-production-env.sh
          sh -n scripts/verify-production.sh
