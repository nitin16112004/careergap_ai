name: Product CI

on:
  pull_request:
    branches: [dev, feat/mvp-backbone, feat/ats-v1-1, feat/rag-v1-2, feat/v1-3-hardening, feat/v1-4-reminders, feat/billing-upgrade, feat/admin-panel, feat/phase16-testing]
  push:
    branches: [feat/mvp-backbone, feat/ats-v1-1, feat/rag-v1-2, feat/v1-3-hardening, feat/v1-4-reminders, feat/billing-upgrade, feat/admin-panel, feat/phase16-testing]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit high-severity production dependencies
        # Release security gate: audit the dependency tree that ships at runtime.
        # Dev tooling is validated separately by typecheck, test, and build below.
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit high-severity production dependencies
        # Release security gate: audit the dependency tree that ships at runtime.
        # Dev tooling is validated separately by typecheck, test, and build below.
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Dependency consistency
        run: pip check
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        run: pytest -q

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build -t careerguid-ai-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t careerguid-ai-frontend:ci ./frontend
      - name: Build AI service image
        run: docker build -t careerguid-ai-service:ci ./ai-service
      - name: Validate edge Nginx configuration
        run: >-
          docker run --rm
          --add-host backend:127.0.0.1
          --add-host frontend:127.0.0.1
          -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t
