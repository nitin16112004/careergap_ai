name: Release Production Images

on:
  workflow_run:
    workflows: ["Product CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve immutable release SHA
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            release_sha="${{ github.event.workflow_run.head_sha }}"
          else
            release_sha="$GITHUB_SHA"
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Validate frontend public production configuration
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
        run: |
          test -n "$PRODUCTION_SUPABASE_URL" || { echo "Missing PRODUCTION_SUPABASE_URL" >&2; exit 1; }
          test -n "$PRODUCTION_SUPABASE_ANON_KEY" || { echo "Missing PRODUCTION_SUPABASE_ANON_KEY" >&2; exit 1; }
          case "$PRODUCTION_SUPABASE_URL" in https://*) ;; *) echo "PRODUCTION_SUPABASE_URL must use https://" >&2; exit 1 ;; esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/careerguid-ai-backend:${{ steps.release.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/careerguid-ai-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            PUBLIC_API_URL=/api/v1
            PUBLIC_SUPABASE_URL=${{ secrets.PRODUCTION_SUPABASE_URL }}
            PUBLIC_SUPABASE_ANON_VALUE=${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/careerguid-ai-frontend:${{ steps.release.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/careerguid-ai-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Publish AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/careerguid-ai-service:${{ steps.release.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/careerguid-ai-service:latest
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Release summary
        run: |
          echo "Published immutable production images for ${{ steps.release.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workers and scheduler intentionally reuse the backend image at the same immutable tag." >> "$GITHUB_STEP_SUMMARY"
